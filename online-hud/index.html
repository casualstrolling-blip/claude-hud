<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark">
<title>Neural · Usage HUD</title>
<link rel="stylesheet" href="/hud.css?v=20260913-cat3"><script src="/hud.js?v=20260913-cat3" defer></script>
</head>
<body data-provider="chatgpt">
<main class="hud" id="hud">
  <header class="topbar">
    <div class="wordmark"><span class="mark" aria-hidden="true">N<span>↗</span></span><span>NEURAL<span class="wordmark-sub">PERSONAL TELEMETRY</span></span></div>
    <div class="tools"><button class="utility" id="dim" type="button" aria-pressed="false" aria-label="Toggle dim display">◐ <span>Dim</span></button><button class="utility" id="mode" type="button" aria-pressed="false" title="Eco refreshes every 15 seconds. Live refreshes every second."><span id="mode-label">Eco · 15s</span></button></div>
  </header>
  <section class="readout" aria-labelledby="provider-name">
    <div class="provider-row"><div><p class="eyebrow">YOUR USAGE, AT A GLANCE</p><h1 id="provider-name">ChatGPT<span class="provider-index" aria-hidden="true"> / 01</span></h1></div><span class="connection" id="connection" role="status">Connecting</span></div>
    <div class="metrics">
      <article class="metric primary" aria-labelledby="session-label">
        <div class="metric-heading"><h2 id="session-label">Session</h2><span class="window-tag">SHORT WINDOW</span></div>
        <div class="reading"><span class="number" id="session-number">—</span><span class="unit">%<span>USED</span></span></div>
        <div class="scale" id="session-scale" role="progressbar" aria-label="Session usage" aria-valuemin="0" aria-valuemax="100"><div class="scale-fill" id="session-fill"></div></div>
        <div class="scale-labels"><span>0</span><span>CAPACITY</span><span>100</span></div>
        <div class="metric-footer"><span id="session-state">Waiting for data</span><div class="reset"><span>RESETS IN</span><strong id="session-reset">—</strong></div></div>
      </article>
      <article class="metric secondary" aria-labelledby="weekly-label">
        <div class="metric-heading"><h2 id="weekly-label">Weekly</h2><span class="window-tag">LONG WINDOW</span></div>
        <div class="reading"><span class="number" id="weekly-number">—</span><span class="unit">%<span>USED</span></span></div>
        <div class="scale" id="weekly-scale" role="progressbar" aria-label="Weekly usage" aria-valuemin="0" aria-valuemax="100"><div class="scale-fill" id="weekly-fill"></div></div>
        <div class="scale-labels"><span>0</span><span>CAPACITY</span><span>100</span></div>
        <div class="metric-footer"><span id="weekly-state">Waiting for data</span><div class="reset"><span>RESETS IN</span><strong id="weekly-reset">—</strong></div></div>
      </article>
    </div>
    <div class="data-note"><span id="updated">Fetching your usage…</span><a id="sign-in" href="/" hidden>Sign in again ↗</a><span class="oled-note">OLED BLACK <span aria-hidden="true">◆</span></span></div>
  </section>
  <footer class="bottom">
    <nav class="provider-switch" aria-label="Usage provider"><button type="button" data-select="chatgpt" aria-pressed="true"><span class="provider-icon" aria-hidden="true">◎</span><span>ChatGPT</span><span class="selected-dot" aria-hidden="true"></span></button><button type="button" data-select="claude" aria-pressed="false"><span class="provider-icon claude-icon" aria-hidden="true">✳</span><span>Claude</span><span class="selected-dot" aria-hidden="true"></span></button></nav>
    <div class="footer-meta"><span id="date"></span><span>LESS LIGHT. MORE CLARITY.</span></div>
  </footer>
  <div class="cat-overlay" id="cat-overlay" data-phase="off" data-pose="sit" data-facing="right" aria-hidden="true"><canvas id="cat-still"></canvas><img id="cat-motion" alt="" decoding="async" aria-hidden="true"></div>
</main>
</body>
</html>
