name: Notify HUD on Deploy
on:
  push:
    branches: [main]

jobs:
  notify-hud:
    runs-on: ubuntu-latest
    steps:
      - name: Notify HUD — build starting
        run: |
          curl -sf -X POST https://claude-hud.vercel.app/api/deploy-webhook \
            -H 'Content-Type: application/json' \
            -d '{"type":"deployment.building","payload":{"deployment":{"name":"claude-hud","url":"claude-hud.vercel.app"}}}' || true

      - name: Wait for Vercel to be READY then notify HUD
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          sleep 15
          for i in $(seq 1 24); do
            STATE=$(curl -s \
              "https://api.vercel.com/v6/deployments?projectId=prj_QeIksrl7XlsLiBwdimeYCAJkhxRv&teamId=team_S3eUlukkYCnIDd23y35M6dX6&limit=1&target=production" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              | grep -o '"readyState":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "Attempt $i — state: $STATE"
            if [ "$STATE" = "READY" ]; then
              curl -sf -X POST https://claude-hud.vercel.app/api/deploy-webhook \
                -H 'Content-Type: application/json' \
                -d '{"type":"deployment.ready","payload":{"deployment":{"name":"claude-hud","url":"claude-hud.vercel.app"}}}'
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for deployment"
