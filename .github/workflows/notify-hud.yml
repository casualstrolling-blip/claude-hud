name: Notify HUD on Deploy

on:
  push:
    branches: [main]

jobs:
  notify-hud:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel to deploy
        run: sleep 75

      - name: Notify HUD of successful deployment
        run: |
          curl -sf -X POST https://claude-hud.vercel.app/api/deploy-webhook \
            -H 'Content-Type: application/json' \
            -d '{"type":"deployment.ready","payload":{"deployment":{"name":"claude-hud","url":"claude-hud.vercel.app"}}}' || true
